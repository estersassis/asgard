[project]
name = "asgard"
version = "0.1.0"
description = "Generate evidence-based SECURITY.md files from GitHub pull request discussions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "rich", "google-genai", "openai", "anthropic"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "openpyxl"]
export = ["openpyxl"]

[project.scripts]
asgard = "asgard.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asgard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not smoke"]
markers = ["smoke: live provider calls, skipped in the default run"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
