<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ASGARD · Setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..500&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#191B1F}
.ag{--stone:#191B1F;--panel:#202327;--well:#141619;--ink:#E8E6D9;--ink-soft:#8D9082;--line:#2C2F2A;--ember:#D68C42;--ember-hi:#F0AC63;--bifrost:#6FA8C7;--yes:#6FB981;--no:#D97862;--on-ember:#1A1408}
.ag[data-theme="light"]{--stone:#E3E1D4;--panel:#EDEBDE;--well:#D9D7C8;--ink:#23261F;--ink-soft:#55584C;--line:#C6C4B2;--ember:#A8652A;--ember-hi:#8C551E;--bifrost:#3C6E8C;--yes:#3F7A50;--no:#A8432F;--on-ember:#FFF8EE}
.ag{background:var(--stone);color:var(--ink);font-family:'JetBrains Mono',Consolas,monospace;font-size:14px;line-height:1.6;min-height:100vh}
.ag *{box-sizing:border-box}
.serif{font-family:'Fraunces',Georgia,serif}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.nav{display:flex;align-items:center;gap:8px;padding:0 12px;min-height:44px;color:var(--ink-soft);text-decoration:none;font-size:13px;border-bottom:1px solid transparent}
.nav:hover{color:var(--ink)}
.nav .n{font-family:'Fraunces',Georgia,serif;color:var(--ember)}
.nav.on{color:var(--ink);border-bottom-color:var(--ember)}
.inp{width:100%;min-height:48px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;font-size:16px;padding:8px 0}
.inp:focus{outline:none;border-bottom-color:var(--ember)}
label.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.hint{font-size:12px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);text-decoration:none}
.btn.pri{background:var(--ember);border-color:var(--ember);color:var(--on-ember);font-weight:600}
.btn.pri:hover{background:var(--ember-hi)}
.link{background:none;border:0;color:var(--ink-soft);font:inherit;font-size:13px;cursor:pointer;min-height:44px;padding:0}
.link:hover{color:var(--ink)}
a{color:var(--ember)}
</style>
</helmet>
<div class="ag" data-theme="{{theme}}">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 20px 48px">
  <a href="Setup.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink)">
    <svg width="26" height="24" viewBox="0 0 100 92" aria-hidden="true"><rect x="15" y="40" width="13" height="49" rx="1" fill="#C47C38"></rect><rect x="72" y="40" width="13" height="49" rx="1" fill="#C47C38"></rect><path d="M17 41 L36 20 L50 11 L64 20 L83 41" fill="none" stroke="#C47C38" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="50,3 41,14 50,25" fill="#D97862"></polygon><polygon points="50,3 59,14 50,25" fill="#6FB981"></polygon></svg>
    <span class="serif" style="font-weight: 700; font-size: 18px; letter-spacing: 0.14em">ASGARD</span>
  </a>
  <nav aria-label="Screens" style="display: flex; flex-wrap: wrap">
    <a class="nav on" href="Setup.dc.html" aria-current="page"><span class="n">I</span>Setup</a>
    <a class="nav" href="Pipeline.dc.html"><span class="n">II</span>Pipeline</a>
    <a class="nav" href="Council.dc.html"><span class="n">III</span>Council</a>
    <a class="nav" href="Guideline.dc.html"><span class="n">IV</span>Guideline</a>
    <a class="nav" href="Forge.dc.html"><span class="n">V</span>Forge</a>
  </nav>
</header>

<main style="max-width: 640px; margin: 0 auto; padding: 56px 24px 96px; display: flex; flex-direction: column; align-items: center; gap: 48px">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; position: relative">
    <div aria-hidden="true" style="position: absolute; top: -40px; width: 320px; height: 240px; background: radial-gradient(circle, rgba(214,140,66,0.16), rgba(214,140,66,0) 65%)"></div>
    <svg width="96" height="88" viewBox="0 0 100 92" aria-hidden="true" style="position: relative"><defs><linearGradient id="gH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0AC63"></stop><stop offset="1" stop-color="#8C551E"></stop></linearGradient></defs><rect x="15" y="40" width="13" height="49" rx="1" fill="url(#gH)"></rect><rect x="72" y="40" width="13" height="49" rx="1" fill="url(#gH)"></rect><path d="M17 41 L36 20 L50 11 L64 20 L83 41" fill="none" stroke="url(#gH)" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"></path><polygon points="50,3 41,14 50,25" fill="#D97862"></polygon><polygon points="50,3 59,14 50,25" fill="#6FB981"></polygon></svg>
    <h1 class="serif" style="position: relative; margin: 0; font-weight: 300; font-size: 48px; line-height: 1.08">Open the gate to <em style="color: var(--ember)">any</em> repository.</h1>
    <p style="position: relative; margin: 0; color: var(--ink-soft); max-width: 44ch">A SECURITY.md written from its pull request discussions, every line backed by evidence.</p>
  </div>

  <form aria-label="Run setup" style="width: 100%; display: flex; flex-direction: column; gap: 28px">
    <label class="f"><span class="lbl">Repository</span><input class="inp" defaultValue="jpadilla/pyjwt"></label>
    <label class="f"><span class="lbl">GitHub token</span><input class="inp" type="password" defaultValue="ghp_xxxxxxxxxxxxxxxxxxxx">
      <span class="hint" style="color: var(--yes)">✓ Can read jpadilla/pyjwt · read from .env, never saved</span>
    </label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 28px">
      <label class="f"><span class="lbl">Provider</span>
        <select class="inp" value="{{prov}}" onChange="{{pickProv}}"><option value="ollama">Ollama (local, free)</option><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="anthropic">Anthropic</option></select>
      </label>
      <label class="f"><span class="lbl">Model</span><select class="inp" value="{{model}}" onChange="{{editModel}}"><option value="{{model}}">{{model}}</option></select></label>
    </div>

    <sc-for list="{{creds}}" as="c" hint-placeholder-count="1">
      <label class="f"><span class="lbl">{{c.label}}</span><input class="inp" type="{{c.type}}" defaultValue="{{c.value}}" placeholder="{{c.placeholder}}">
        <span class="hint" style="color: {{c.hintColor}}">{{c.hint}}</span>
      </label>
    </sc-for>

    <button type="button" class="link" aria-expanded="{{open}}" onClick="{{toggle}}" style="align-self: flex-start">{{toggleLabel}}</button>

    <sc-if value="{{showMore}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 32px">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 28px">
          <label class="f"><span class="lbl">Max PRs</span><input class="inp" type="number" defaultValue="200"></label>
          <label class="f"><span class="lbl">State</span><select class="inp"><option>all</option><option>open</option><option>closed</option></select></label>
          <label class="f"><span class="lbl">Since</span><input class="inp" type="date" defaultValue="2023-01-01"></label>
          <label class="f"><span class="lbl">Until</span><input class="inp" type="date" defaultValue="2026-10-14"></label>
          <label class="f"><span class="lbl">Max iterations</span><input class="inp" type="number" defaultValue="3"></label>
          <label class="f"><span class="lbl">Batch size</span><input class="inp" type="number" defaultValue="10"></label>
          <label class="f"><span class="lbl">Pre-filter</span><select class="inp"><option>on</option><option>off</option></select></label>
        </div>
        <div style="display: flex; flex-direction: column; gap: 16px">
          <span class="lbl">Model per role · default unless changed</span>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 28px">
            <sc-for list="{{roles}}" as="r" hint-placeholder-count="3">
              <label class="f"><span class="lbl" style="color: {{r.color}}">{{r.label}}</span>
                <select class="inp" style="font-size: 14px" value="{{r.value}}" onChange="{{r.pick}}"><option value="default">default</option><option value="ollama">Ollama</option><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="anthropic">Anthropic</option></select>
              </label>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-if>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 8px">
      <a class="btn pri" href="Pipeline.dc.html" style="min-width: 240px">Start run</a>
      <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap; justify-content: center">
        <button type="button" class="link">Load asgard.toml</button>
        <span aria-hidden="true" style="color: var(--line)">·</span>
        <button type="button" class="link">Save asgard.toml</button>
      </div>
      <span style="font-size: 12px; color: var(--ink-soft)">Same config runs with <code>asgard run --config asgard.toml</code></span>
    </div>
  </form>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { more: false, prov: 'ollama', classifier: 'default', evaluator: 'gemini', synthesizer: 'default' }; }
  renderVals() {
    var self = this, s = this.state, m = s.more;
    var MODEL = { ollama: 'llama3.1', gemini: 'gemini-2.5-flash', openai: 'gpt-4.1-mini', anthropic: 'claude-sonnet-5-5' };
    var KEY = { gemini: ['Gemini API key', 'GEMINI_API_KEY'], openai: ['OpenAI API key', 'OPENAI_API_KEY'], anthropic: ['Anthropic API key', 'ANTHROPIC_API_KEY'] };
    var used = [s.prov];
    ['classifier', 'evaluator', 'synthesizer'].forEach(function (r) { used.push(s[r] === 'default' ? s.prov : s[r]); });
    var order = ['ollama', 'gemini', 'openai', 'anthropic'];
    var creds = order.filter(function (p) { return used.indexOf(p) >= 0; }).map(function (p) {
      if (p === 'ollama') return { label: 'Ollama host', type: 'text', value: 'http://localhost:11434', placeholder: 'http://localhost:11434', hint: '✓ Daemon answers · llama3.1 is pulled', hintColor: 'var(--yes)' };
      var filled = p === 'gemini';
      return { label: KEY[p][0], type: 'password', value: filled ? 'AIzaxxxxxxxxxxxxxxxxxxxx' : '', placeholder: KEY[p][1] + ' from .env, or paste it here',
        hint: filled ? '✓ Key works · read from .env, never saved to config' : 'Needed because a role uses ' + KEY[p][0].replace(' API key', '') + '. Never saved to config.',
        hintColor: filled ? 'var(--yes)' : 'var(--ink-soft)' };
    });
    var roles = [['classifier', 'Classifier', 'var(--ember)'], ['evaluator', 'Evaluator', 'var(--bifrost)'], ['synthesizer', 'Synthesizer', 'var(--ink-soft)']].map(function (r) {
      return { label: r[1], color: r[2], value: s[r[0]], pick: function (e) { var o = {}; o[r[0]] = e.target.value; self.setState(o); } };
    });
    return {
      theme: this.props.theme ?? 'dark',
      prov: s.prov, model: s.model ?? MODEL[s.prov], creds: creds, roles: roles,
      pickProv: function (e) { self.setState({ prov: e.target.value, model: MODEL[e.target.value] }); },
      editModel: function (e) { self.setState({ model: e.target.value }); },
      showMore: m, open: m ? 'true' : 'false',
      toggleLabel: m ? '− Fewer options' : '+ More options',
      toggle: function () { self.setState({ more: !m }); }
    };
  }
}
</script>
</body>
</html>
