<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2340 644" width="2340" height="644">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b616b"/>
    </marker>
    <style>
      .sans { font-family: Helvetica, Arial, Inter, sans-serif; }
      .mono { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; }
      .panel { fill: #f6f7f9; stroke: #c5c9d1; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #c5c9d1; stroke-width: 2; }
      .opt { fill: #ffffff; stroke: #8a8f98; stroke-width: 2; stroke-dasharray: 9 6; }
      .head { font-size: 22px; font-weight: 700; letter-spacing: 2.5px; fill: #3d424a; }
      .name { font-size: 32px; fill: #1f2328; }
      .sub { font-size: 22px; fill: #555b65; }
      .txt { font-size: 22px; fill: #1f2328; }
      .bold { font-size: 24px; font-weight: 700; fill: #1f2328; }
      .num { font-size: 22px; font-weight: 700; fill: #ffffff; }
      .line { stroke: #5b616b; stroke-width: 2.5; fill: none; }
      .dot { stroke: #a5aab3; stroke-width: 2; stroke-dasharray: 5 7; }
    </style>
  </defs>
  <rect width="2340" height="644" fill="#ffffff"/>

  <!-- ============ COLLECTION ============ -->
  <rect class="panel" x="16" y="16" width="340" height="500" rx="16"/>
  <text class="sans head" x="36" y="60">COLLECTION</text>
  <g fill="none" stroke="#1f2328" stroke-width="3.5">
    <circle cx="168" cy="96" r="10"/>
    <circle cx="208" cy="112" r="10"/>
    <circle cx="168" cy="152" r="10"/>
    <line x1="168" y1="106" x2="168" y2="142"/>
    <path d="M208,122 C208,138 186,134 172,143"/>
  </g>
  <text class="mono" x="186" y="200" font-size="24" text-anchor="middle" fill="#1f2328">owner/name</text>
  <line class="line" x1="186" y1="210" x2="186" y2="234" marker-end="url(#arr)"/>

  <rect class="box" x="32" y="240" width="308" height="112" rx="10"/>
  <circle cx="68" cy="296" r="20" fill="#8a8f98"/>
  <text class="sans num" x="68" y="304" text-anchor="middle">1</text>
  <text class="mono name" x="104" y="288">mine</text>
  <text class="sans sub" x="104" y="324">GitHub GraphQL API</text>
  <line class="line" x1="186" y1="352" x2="186" y2="382" marker-end="url(#arr)"/>

  <rect class="box" x="32" y="388" width="308" height="112" rx="10"/>
  <circle cx="68" cy="444" r="20" fill="#8a8f98"/>
  <text class="sans num" x="68" y="452" text-anchor="middle">2</text>
  <text class="mono name" x="104" y="436">normalize</text>
  <text class="sans sub" x="104" y="472">PR → JSON schema</text>

  <polyline class="line" points="340,444 376,444 376,324 418,324" marker-end="url(#arr)"/>

  <!-- ============ CLASSIFICATION ============ -->
  <rect x="396" y="16" width="860" height="500" rx="16" fill="#eaf0f7" stroke="#b9c3d3" stroke-width="2"/>
  <text class="sans head" x="416" y="60">CLASSIFICATION</text>
  <circle cx="1062" cy="52" r="11" fill="#2b4c7e"/>
  <text class="sans sub" x="1082" y="60">calls an LLM</text>

  <circle cx="436" cy="110" r="20" fill="#2b4c7e"/>
  <text class="sans num" x="436" y="118" text-anchor="middle">3</text>
  <text class="mono name" x="472" y="122">classify</text>
  <text class="sans" x="648" y="120" font-size="24" fill="#555b65">Evaluator-Optimizer loop</text>

  <rect class="box" x="424" y="228" width="264" height="192" rx="10"/>
  <text class="sans" x="448" y="276" font-size="30" font-weight="700" fill="#1f2328">Classifier</text>
  <rect x="608" y="254" width="60" height="30" rx="15" fill="#2b4c7e"/>
  <text class="sans" x="638" y="276" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">LLM</text>
  <text class="sans txt" x="448" y="324">binary decision</text>
  <text class="sans txt" x="448" y="358">+ quote &amp; location</text>
  <text class="sans txt" x="448" y="392">+ rationale</text>

  <line class="line" x1="688" y1="296" x2="858" y2="296" marker-end="url(#arr)"/>
  <text class="sans txt" x="776" y="280" text-anchor="middle">classification</text>

  <rect class="box" x="864" y="180" width="348" height="280" rx="10"/>
  <text class="sans" x="888" y="224" font-size="30" font-weight="700" fill="#1f2328">Evaluator</text>

  <rect class="box" x="884" y="244" width="308" height="76" rx="6"/>
  <circle cx="913" cy="268" r="13" fill="none" stroke="#1f2328" stroke-width="2"/>
  <text class="sans" x="913" y="275" font-size="18" font-weight="700" fill="#1f2328" text-anchor="middle">1</text>
  <text class="sans bold" x="940" y="276">quote check</text>
  <text class="sans sub" x="900" y="306">verbatim match, no LLM</text>

  <rect class="box" x="884" y="336" width="308" height="108" rx="6"/>
  <circle cx="913" cy="360" r="13" fill="none" stroke="#1f2328" stroke-width="2"/>
  <text class="sans" x="913" y="367" font-size="18" font-weight="700" fill="#1f2328" text-anchor="middle">2</text>
  <text class="sans bold" x="940" y="368">LLM review</text>
  <rect x="1112" y="348" width="60" height="30" rx="15" fill="#2b4c7e"/>
  <text class="sans" x="1142" y="370" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">LLM</text>
  <text class="sans sub" x="900" y="400">decision · evidence ·</text>
  <text class="sans sub" x="900" y="430">completeness · rationale</text>

  <line class="line" x1="864" y1="380" x2="694" y2="380" marker-end="url(#arr)"/>
  <text class="sans" x="776" y="412" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">REVISE +</text>
  <text class="sans txt" x="776" y="440" text-anchor="middle">feedback</text>

  <polyline class="line" points="1212,200 1276,200 1276,140 1306,140" marker-end="url(#arr)"/>
  <text class="sans" x="1253" y="168" font-size="22" font-weight="700" fill="#1f2328" text-anchor="end">approved</text>

  <!-- ============ SYNTHESIS ============ -->
  <rect class="panel" x="1296" y="16" width="340" height="500" rx="16"/>
  <text class="sans head" x="1316" y="60">SYNTHESIS</text>

  <rect class="box" x="1312" y="84" width="308" height="112" rx="10"/>
  <circle cx="1348" cy="140" r="20" fill="#8a8f98"/>
  <text class="sans num" x="1348" y="148" text-anchor="middle">4</text>
  <text class="mono name" x="1384" y="132">consolidate</text>
  <text class="sans sub" x="1384" y="168">approved PRs only</text>
  <line class="line" x1="1466" y1="196" x2="1466" y2="234" marker-end="url(#arr)"/>

  <rect class="box" x="1312" y="240" width="308" height="240" rx="10"/>
  <circle cx="1348" cy="280" r="20" fill="#2b4c7e"/>
  <text class="sans num" x="1348" y="288" text-anchor="middle">5</text>
  <text class="mono name" x="1384" y="290">synthesize</text>
  <rect class="box" x="1332" y="316" width="268" height="56" rx="6"/>
  <text class="sans bold" x="1352" y="354">map</text>
  <text class="sans sub" x="1580" y="354" text-anchor="end">PR → rules</text>
  <line class="line" x1="1466" y1="372" x2="1466" y2="394" marker-end="url(#arr)"/>
  <rect class="box" x="1332" y="400" width="268" height="56" rx="6"/>
  <text class="sans bold" x="1352" y="438">reduce</text>
  <text class="sans sub" x="1580" y="438" text-anchor="end">rules → recs</text>

  <line class="line" x1="1620" y1="424" x2="1682" y2="424" marker-end="url(#arr)"/>

  <!-- ============ OUTPUT ============ -->
  <rect class="panel" x="1676" y="16" width="648" height="500" rx="16"/>
  <text class="sans head" x="1696" y="60">OUTPUT</text>
  <line x1="2182" y1="52" x2="2222" y2="52" stroke="#8a8f98" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text class="sans sub" x="2232" y="60">optional</text>

  <!-- SECURITY.md -->
  <g fill="none" stroke="#1f2328" stroke-width="3.5" stroke-linejoin="round">
    <path d="M1790,100 L1848,100 L1870,122 L1870,198 L1790,198 Z"/>
    <path d="M1848,100 L1848,122 L1870,122"/>
    <line x1="1806" y1="140" x2="1854" y2="140"/>
    <line x1="1806" y1="154" x2="1854" y2="154"/>
    <line x1="1806" y1="168" x2="1854" y2="168"/>
    <line x1="1806" y1="182" x2="1840" y2="182"/>
  </g>
  <text class="mono" x="1830" y="240" font-size="22" text-anchor="middle" fill="#1f2328">SECURITY.md</text>
  <text class="sans sub" x="1830" y="270" text-anchor="middle">links to PRs</text>
  <line class="line" x1="1830" y1="364" x2="1830" y2="292" marker-end="url(#arr)"/>

  <rect class="box" x="1688" y="368" width="300" height="112" rx="10"/>
  <circle cx="1724" cy="424" r="20" fill="#8a8f98"/>
  <text class="sans num" x="1724" y="432" text-anchor="middle">6</text>
  <text class="mono name" x="1760" y="416">security_md</text>
  <text class="sans sub" x="1760" y="452">links citations</text>

  <!-- simplify (optional) -->
  <line x1="1988" y1="424" x2="2022" y2="424" stroke="#5b616b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arr)"/>

  <g fill="none" stroke="#1f2328" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="8 5">
    <path d="M2126,100 L2184,100 L2206,122 L2206,198 L2126,198 Z"/>
  </g>
  <g fill="none" stroke="#1f2328" stroke-width="3.5" stroke-linejoin="round">
    <path d="M2184,100 L2184,122 L2206,122"/>
    <line x1="2142" y1="146" x2="2190" y2="146"/>
    <line x1="2142" y1="166" x2="2190" y2="166"/>
    <line x1="2142" y1="186" x2="2176" y2="186"/>
  </g>
  <text class="mono" x="2166" y="240" font-size="20" text-anchor="middle" fill="#1f2328">SECURITY.simplified.md</text>
  <text class="sans sub" x="2166" y="270" text-anchor="middle">same citations</text>
  <line x1="2166" y1="364" x2="2166" y2="292" stroke="#5b616b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arr)"/>

  <rect class="opt" x="2028" y="368" width="280" height="112" rx="10"/>
  <circle cx="2066" cy="424" r="20" fill="#2b4c7e"/>
  <text class="sans num" x="2066" y="432" text-anchor="middle">7</text>
  <text class="mono name" x="2102" y="416">simplify</text>
  <text class="sans sub" x="2102" y="452">didactic rewrite</text>

  <!-- ============ BUNDLE ============ -->
  <line class="dot" x1="186" y1="516" x2="186" y2="556"/>
  <line class="dot" x1="826" y1="516" x2="826" y2="556"/>
  <line class="dot" x1="1466" y1="516" x2="1466" y2="556"/>
  <line class="dot" x1="1830" y1="516" x2="1830" y2="556"/>
  <line class="dot" x1="2166" y1="516" x2="2166" y2="556"/>

  <rect class="panel" x="16" y="556" width="2308" height="72" rx="14"/>
  <circle cx="52" cy="592" r="20" fill="#8a8f98"/>
  <text class="sans num" x="52" y="600" text-anchor="middle">8</text>
  <text class="mono name" x="88" y="604">bundle</text>
  <text class="sans sub" x="224" y="602">run directory: config.json · events.jsonl · trace.jsonl (every model call) · manifest.json (prompt hashes, models, counts, loop metrics, simplify if run)</text>
</svg>
