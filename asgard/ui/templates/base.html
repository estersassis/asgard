<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}ASGARD{% endblock %}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..500&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/shell.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="ag" id="ag"{% if theme == 'light' %} data-theme="light"{% endif %}>
    <script>
      (function () {
        var root = document.getElementById("ag");
        if (!root) return;
        var fromUrl = new URLSearchParams(location.search).get("theme");
        var saved = null;
        try { saved = localStorage.getItem("asgard-theme"); } catch (e) {}
        var theme = (fromUrl === "light" || fromUrl === "dark")
          ? fromUrl
          : (saved === "light" || saved === "dark" ? saved : null);
        if (theme === "light") root.setAttribute("data-theme", "light");
        else if (theme === "dark") root.removeAttribute("data-theme");
        if (theme === "light" || theme === "dark") {
          try { localStorage.setItem("asgard-theme", theme); } catch (e) {}
        }
      })();
    </script>
    <header class="site-header">
      {% set run_qs = ('?run=' ~ (run|urlencode)) if run else '' %}
      <a class="brand" href="{{ url_for('setup') }}{{ run_qs }}">
        <svg width="26" height="24" viewBox="0 0 100 92" aria-hidden="true">
          <rect x="15" y="40" width="13" height="49" rx="1" fill="var(--ember)"></rect>
          <rect x="72" y="40" width="13" height="49" rx="1" fill="var(--ember)"></rect>
          <path d="M17 41 L36 20 L50 11 L64 20 L83 41" fill="none" stroke="var(--ember)" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"></path>
          <polygon points="50,3 41,14 50,25" fill="var(--no)"></polygon>
          <polygon points="50,3 59,14 50,25" fill="var(--yes)"></polygon>
        </svg>
        <span class="serif brand-mark">ASGARD</span>
      </a>
      <nav class="screens" aria-label="Screens">
        <a class="nav{% if screen == 'setup' %} on{% endif %}" href="{{ url_for('setup') }}{{ run_qs }}"{% if screen == 'setup' %} aria-current="page"{% endif %}><span class="n">I</span>Setup</a>
        <a class="nav{% if screen == 'pipeline' %} on{% endif %}" href="{{ url_for('pipeline') }}{{ run_qs }}"{% if screen == 'pipeline' %} aria-current="page"{% endif %}><span class="n">II</span>Pipeline</a>
        <a class="nav{% if screen == 'council' %} on{% endif %}" href="{{ url_for('council') }}{{ run_qs }}"{% if screen == 'council' %} aria-current="page"{% endif %}><span class="n">III</span>Council</a>
        <a class="nav{% if screen == 'guideline' %} on{% endif %}" href="{{ url_for('guideline') }}{{ run_qs }}"{% if screen == 'guideline' %} aria-current="page"{% endif %}><span class="n">IV</span>Guideline</a>
        <a class="nav{% if screen == 'forge' %} on{% endif %}" href="{{ url_for('forge') }}{{ run_qs }}"{% if screen == 'forge' %} aria-current="page"{% endif %}><span class="n">V</span>Forge</a>
      </nav>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to light theme" title="Theme">
        <svg class="theme-icon theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="theme-icon theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"></path>
        </svg>
      </button>
    </header>
    <main class="page{% block page_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer" id="runs-footer" hidden>
      <div class="site-footer-inner">
        <span class="lbl">Past runs</span>
        <ul class="runs-footer-list" id="runs-menu-list"></ul>
        <p class="runs-footer-empty" id="runs-menu-empty" hidden>No runs on disk yet</p>
      </div>
    </footer>
  </div>
  <script src="{{ url_for('static', path='js/shell.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
